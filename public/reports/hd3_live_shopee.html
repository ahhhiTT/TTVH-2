/* ---------- AI Insight computation — gắn theo từng Tab (02/03/04/05) ---------- */
function computeOverviewInsightData(){
  const S = STATE;
  if(!S.overview || !S.overview.blocks[0] || !S.overview.blocks[0].rows[0]) return null;
  const row = S.overview.blocks[0].rows[0];
  const pick = groupSubstr => { for(const g in row.metricsByGroup){ if(g.indexOf(groupSubstr)!==-1) return row.metricsByGroup[g]; } return []; };
  const findIn = (groupSubstr, header) => { const arr = pick(groupSubstr); const m = arr.find(x=>x.header===header); return m||null; };
  const toPairs = arr => arr.map(m=>({metric:m.header, value:m.raw}));
  const funnelMetrics = toPairs(pick('Tỷ lệ chuyển đổi - Phễu Chuyển Đổi'));
  const perfMetrics = toPairs(pick('Tỷ lệ chuyển đổi - Hiệu suất'));
  const engagementMetrics = toPairs(pick('Sự tương tác'));
  const promoMetrics = toPairs(pick('Khuyến mãi'));
  const trafficGroup = pick('Nguồn Truy Cập');
  const find2 = h => trafficGroup.find(m=>m.header===h);
  const a=find2('Lượt xem Live'), b=find2('Người xem live'), c=find2('Số người xem tương tác');
  const viewToViewerRate = (a&&b&&a.num) ? b.num/a.num : null;
  const viewerToEngagedRate = (b&&c&&b.num) ? c.num/b.num : null;
  const newP = findIn('Giao dịch','Doanh số từ Khách hàng Mới(Đơn đã đặt)');
  const oldP = findIn('Giao dịch','Doanh số từ Khách hàng Cũ(Đơn đã đặt)');
  const customerSplit = (newP && oldP && (newP.num+oldP.num)) ? { newSharePlaced: newP.num/(newP.num+oldP.num), oldSharePlaced: oldP.num/(newP.num+oldP.num) } : null;
  return { timeframe: row.timeframe, viewToViewerRate, viewerToEngagedRate, funnelMetrics, perfMetrics, engagementMetrics, promoMetrics, customerSplit };
}

function computeSessionInsightData(){
  const S = STATE;
  if(!S.session || !S.session.rows.length) return null;
  const rows = S.session.rows;
  const totalRevenue = rows.reduce((a,r)=>a+(r.revenuePlaced||0),0);
  const withRev = rows.filter(r=>r.revenuePlaced!=null).sort((a,b)=>b.revenuePlaced-a.revenuePlaced);
  const best = withRev[0] || null, worst = withRev.length? withRev[withRev.length-1] : null;
  const dayStageBm = LiveSegmentEngine.buildDayStageBenchmarks(rows, S.dayStageConfig);
  const dailyBenchmark = dayStageBm['Daily'] ? dayStageBm['Daily'].avgGmvPerHour : null;
  const dailyBenchmarkSessions = dayStageBm['Daily'] ? dayStageBm['Daily'].sessions : 0;
  const aboveCount = (dailyBenchmark!=null) ? rows.filter(r=> r.derived.gmvPerHourPlaced!=null && r.derived.gmvPerHourPlaced>=dailyBenchmark).length : null;
  const abovePct = (aboveCount!=null && rows.length) ? aboveCount/rows.length : null;
  const bestShare = (best && totalRevenue) ? best.revenuePlaced/totalRevenue : null;
  const factorOf = r => {
    if(!r) return null;
    const stage = LiveSegmentEngine.dayStage(r.startAt, S.dayStageConfig);
    const stageBm = dayStageBm[stage] ? dayStageBm[stage].avgGmvPerHour : null;
    return {
      name: r.name, revenuePlaced: r.revenuePlaced, hours: r.durationSec? r.durationSec/3600 : null,
      gmvPerHourPlaced: r.derived.gmvPerHourPlaced, startRaw: r.startRaw,
      weekday: r.startAt? LiveSegmentEngine.weekdayVN(r.startAt): null,
      timeSlot: LiveSegmentEngine.timeSlot(r.startAt, S.timeSlotEdges),
      dayStage: stage, ownDayStageBenchmarkGmvPerHour: stageBm,
      vsOwnDayStageBenchmarkPct: (stageBm && r.derived.gmvPerHourPlaced!=null) ? (r.derived.gmvPerHourPlaced-stageBm)/stageBm : null,
    };
  };
  const byWeekday = LiveSegmentEngine.build(rows,'weekday');
  const byTimeSlot = LiveSegmentEngine.build(rows,'timeSlot');
  const topWeekday = [...byWeekday].sort((a,b)=>(b.gmvPerHourPlaced||0)-(a.gmvPerHourPlaced||0))[0]||null;
  const topTimeSlot = [...byTimeSlot].sort((a,b)=>(b.gmvPerHourPlaced||0)-(a.gmvPerHourPlaced||0))[0]||null;
  const byDayStage = LiveSegmentEngine.build(rows,'dayStage').map(s=>({dim:s.dim, sessions:s.sessions, hours:s.hours, gmvPerHourPlaced:s.gmvPerHourPlaced, revenuePlaced:s.revenuePlaced, engagedViewerRate:s.engagedViewerRate,
    vsDailyBenchmarkPct: (dailyBenchmark && s.gmvPerHourPlaced!=null) ? (s.gmvPerHourPlaced-dailyBenchmark)/dailyBenchmark : null }));
  const viewers = rows.reduce((a,r)=>a+(r.viewers||0),0);
  const engaged = rows.reduce((a,r)=>a+(r.engagedViewers||0),0);
  const comments = rows.reduce((a,r)=>a+(r.comments||0),0);
  const watchWeighted = rows.reduce((a,r)=>a+((r.avgWatchSec||0)*(r.viewers||0)),0);
  const avgWatch = viewers? watchWeighted/viewers : null;
  const withRate = rows.filter(r=>r.derived.engagedViewerRate!=null).sort((a,b)=>b.derived.engagedViewerRate-a.derived.engagedViewerRate);
  const k = Math.min(3, withRate.length);
  const top = withRate.slice(0,k), bottom = withRate.slice(withRate.length-k);
  const convOf = arr=>{ const v=arr.reduce((a,r)=>a+(r.viewers||0),0); const o=arr.reduce((a,r)=>a+(r.ordersPlaced||0),0); return v? o/v : null; };
  const avgOf = arr=> arr.length? arr.reduce((a,r)=>a+r.derived.engagedViewerRate,0)/arr.length : null;
  return { totalRevenue, totalSessions: rows.length, best: factorOf(best), worst: factorOf(worst),
    benchmarkNote: 'Toàn bộ so sánh benchmark ở đây dùng GMV/GIỜ (không dùng GMV/phiên) vì các phiên không cùng thời lượng, so theo phiên sẽ thiên vị phiên live dài. "dailyBenchmark" = GMV/giờ trung bình CHỈ tính trên các phiên loại Daily (đã loại trừ D-Day/D-1/D-2/Mini Spike/Mini Spike -1/Memberday). "abovePct" đếm số phiên (thuộc mọi loại ngày) có GMV/giờ đạt ≥ dailyBenchmark này. Mỗi phiên trong best/worst còn có "ownDayStageBenchmarkGmvPerHour" là chuẩn GMV/giờ đúng loại ngày của chính phiên đó (ví dụ phiên D-Day so với benchmark GMV/giờ của riêng D-Day, không so với benchmark Daily). Lưu ý: best/worst vẫn chọn theo revenuePlaced (đóng góp tuyệt đối), còn hiệu suất/giờ dùng field gmvPerHourPlaced đi kèm.',
    dailyBenchmark, dailyBenchmarkSessions, aboveCount, abovePct, bestShare,
    topWeekday: topWeekday?{dim:topWeekday.dim, gmvPerHourPlaced:topWeekday.gmvPerHourPlaced}:null,
    topTimeSlot: topTimeSlot?{dim:topTimeSlot.dim, gmvPerHourPlaced:topTimeSlot.gmvPerHourPlaced}:null,
    byDayStage,
    engagedViewerRate: viewers? engaged/viewers : null, avgWatch, comments,
    topEngageRate: avgOf(top), bottomEngageRate: avgOf(bottom), topConvRate: convOf(top), bottomConvRate: convOf(bottom) };
}

function computeProductInsightData(){
  const S = STATE;
  if(!S.product || !S.product.rows.length) return null;
  const rows = [...S.product.rows].sort((a,b)=>(b.revenuePlaced||0)-(a.revenuePlaced||0));
  const top5 = rows.slice(0,5).map(r=>({productName:r.productName, revenuePlaced:r.revenuePlaced, ordersPlaced:r.ordersPlaced, clickToOrderRatePlaced:r.derived.clickToOrderRatePlaced, quadrant:r.quadrant}));
  const improve = S.product.rows.filter(r=>r.quadrant==='HL').sort((a,b)=>(b.clicks||0)-(a.clicks||0)).slice(0,5)
    .map(r=>({productName:r.productName, clicks:r.clicks, atc:r.atc, ordersPlaced:r.ordersPlaced, clickToOrderRatePlaced:r.derived.clickToOrderRatePlaced}));
  const totalClicks = S.product.rows.reduce((a,r)=>a+(r.clicks||0),0);
  const totalAtcP = S.product.rows.reduce((a,r)=>a+(r.atc||0),0);
  const totalOrdersP = S.product.rows.reduce((a,r)=>a+(r.ordersPlaced||0),0);
  const productAtcToOrderRate = totalAtcP? totalOrdersP/totalAtcP : null;
  let sessionAtcToOrderRate = null;
  if(S.session && S.session.rows.length){
    const atc = S.session.rows.reduce((a,r)=>a+(r.atc||0),0);
    const ord = S.session.rows.reduce((a,r)=>a+(r.ordersPlaced||0),0);
    sessionAtcToOrderRate = atc? ord/atc : null;
  }
  const skuMix = LiveSegmentEngine.buildSkuTypeSummary(S.product.rows).map(s=>({type:s.type, revShare:s.revShare, skuCount:s.skuCount}));
  return { totalProducts: S.product.rows.length, top5, improve, productAtcToOrderRate, sessionAtcToOrderRate, skuMix };
}

function computeSegmentDimInsightData(dimKey){
  const S = STATE;
  if(!S.session || !S.session.rows.length) return null;
  const allRows = S.session.rows;
  const dayStageBm = LiveSegmentEngine.buildDayStageBenchmarks(allRows, S.dayStageConfig);
  const dailyBenchmark = dayStageBm['Daily'] ? dayStageBm['Daily'].avgGmvPerHour : null;
  const dailyBenchmarkSessions = dayStageBm['Daily'] ? dayStageBm['Daily'].sessions : 0;

  if(dimKey === 'dayStage'){
    const segRows = LiveSegmentEngine.build(allRows, 'dayStage');
    const ranked = [...segRows].sort((a,b)=>(b.gmvPerHourPlaced||0)-(a.gmvPerHourPlaced||0)).map((r,i)=>({
      priority: i+1, dim: r.dim, sessions: r.sessions, hours: r.hours, viewers: r.viewers, engagedViewerRate: r.engagedViewerRate,
      atc: r.atc, ordersPlaced: r.ordersPlaced, revenuePlaced: r.revenuePlaced,
      gmvPerHourPlaced: r.gmvPerHourPlaced,
      vsDailyBenchmarkPct: (dailyBenchmark && r.gmvPerHourPlaced!=null) ? (r.gmvPerHourPlaced-dailyBenchmark)/dailyBenchmark : null,
    }));
    return {
      dimLabel: LiveSegmentEngine.dimLabels.dayStage,
      benchmarkNote: 'Xếp hạng và so sánh dùng GMV/GIỜ (không dùng GMV/phiên) vì các phiên không cùng thời lượng — nếu so theo phiên sẽ thiên vị các phiên live kéo dài. Mỗi loại ngày so với "dailyBenchmark" = GMV/giờ trung bình CHỈ tính trên các phiên Daily (ngày thường, đã loại trừ mọi loại campaign) — không so với trung bình toàn kênh vì bị chính các ngày campaign kéo lệch lên.',
      dailyBenchmark, dailyBenchmarkSessions, ranked,
    };
  }

  // weekday / weekOfMonth / timeSlot: chuẩn chính là chỉ dùng phiên Daily, xếp hạng và so sánh theo GMV/Giờ
  const dailyOnlyRows = allRows.filter(r=> LiveSegmentEngine.dayStage(r.startAt, S.dayStageConfig)==='Daily');
  const segDailyOnly = LiveSegmentEngine.build(dailyOnlyRows, dimKey);
  const ranked = [...segDailyOnly].sort((a,b)=>(b.gmvPerHourPlaced||0)-(a.gmvPerHourPlaced||0)).map((r,i)=>({
    priority: i+1, dim: r.dim, sessions: r.sessions, hours: r.hours, viewers: r.viewers, engagedViewerRate: r.engagedViewerRate,
    atc: r.atc, ordersPlaced: r.ordersPlaced, revenuePlaced: r.revenuePlaced,
    gmvPerHourPlaced: r.gmvPerHourPlaced,
    vsBenchmarkPct: (dailyBenchmark && r.gmvPerHourPlaced!=null) ? (r.gmvPerHourPlaced-dailyBenchmark)/dailyBenchmark : null,
  }));

  const segAll = LiveSegmentEngine.build(allRows, dimKey);
  const rankedIncludingAllSessionsForReference = [...segAll].sort((a,b)=>(b.gmvPerHourPlaced||0)-(a.gmvPerHourPlaced||0)).map((r,i)=>({
    priority: i+1, dim: r.dim, sessions: r.sessions, gmvPerHourPlaced: r.gmvPerHourPlaced,
  }));
  const topDailyOnly = ranked[0] || null;
  const topIncludingAllSessions = rankedIncludingAllSessionsForReference[0] || null;
  const confoundedByCampaignDay = !!(topDailyOnly && topIncludingAllSessions && topDailyOnly.dim !== topIncludingAllSessions.dim);

  return {
    dimLabel: LiveSegmentEngine.dimLabels[dimKey],
    benchmarkNote: 'Xếp hạng và so sánh dùng GMV/GIỜ (không dùng GMV/phiên) vì các phiên không cùng thời lượng. Bảng "ranked" CHỈ dùng phiên loại Daily (đã loại trừ D-Day/D-1/D-2/Mini Spike/Mini Spike -1/Memberday) và so với "dailyBenchmark" = GMV/giờ trung bình của riêng nhóm Daily — không dùng trung bình toàn kênh vì bị các ngày campaign kéo lệch. "rankedIncludingAllSessionsForReference" chỉ để đối chiếu xem có bị nhiễu bởi ngày campaign hay không (xem field confoundedByCampaignDay).',
    dailyBenchmark, dailyBenchmarkSessions, ranked,
    topDailyOnly, topIncludingAllSessions, confoundedByCampaignDay,
    rankedIncludingAllSessionsForReference,
  };
}

function mdLite(text){
  let h = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^### (.*)$/gm,'<h4>$1</h4>')
    .replace(/^## (.*)$/gm,'<h4>$1</h4>')
    .replace(/^# (.*)$/gm,'<h4>$1</h4>')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/^- (.*)$/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, m=>'<ul>'+m+'</ul>')
    .replace(/\n\n/g,'</p><p>')
    .replace(/\n/g,'<br>');
  return '<p>'+h+'</p>';
}

const SECTION_KEY_MAP = {
  OVERVIEW:'overview', SESSION:'session', PRODUCT:'product',
  SEGMENT_WEEKDAY:'segment_weekday', SEGMENT_WEEKOFMONTH:'segment_weekOfMonth',
  SEGMENT_TIMESLOT:'segment_timeSlot', SEGMENT_DAYSTAGE:'segment_dayStage',
};
function parseSectionedAIResponse(text){
  const out = {}; Object.values(SECTION_KEY_MAP).forEach(k=> out[k]='');
  const re = /###\s*SECTION_([A-Z_]+)\s*\n?([\s\S]*?)(?=###\s*SECTION_[A-Z_]+|$)/g;
  let m; let found = false;
  while((m = re.exec(text))){
    const key = SECTION_KEY_MAP[m[1]];
    if(key){ out[key] = m[2].trim(); found = true; }
  }
  if(!found) out.overview = text.trim();
  return out;
}

async function doExport(){
  const wb = ExportEngine.build();
  const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const blob = new Blob([wbout], {type:'application/octet-stream'});
  const filename = 'Livestream_Channel_Report.xlsx';
  const downloads = window.claude ? await window.claude.use('downloads') : null;
  if(downloads){
    try{ await downloads.save({filename, data: blob}); return; }catch(e){ /* fall through to anchor */ }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* ---------- Master render ---------- */
function renderAll(){
  renderNav();
  switchView();
  renderUpload();
  renderOverview();
  renderSession();
  renderProduct();
  renderSegment();
  renderBenchmark();
  renderExport();
}

/* ---------- Global tooltip (fixed to viewport, không bị .tablewrap che) ---------- */
function initGlobalTooltip(){
  const tipEl = document.createElement('div');
  tipEl.className = 'gtooltip';
  document.body.appendChild(tipEl);
  function place(target){
    const tip = target.getAttribute('data-tip');
    if(!tip) return;
    tipEl.textContent = tip;
    tipEl.style.display = 'block';
    const r = target.getBoundingClientRect();
    tipEl.style.left = (r.left + r.width/2) + 'px';
    tipEl.style.top = Math.max(8, r.top - 8) + 'px';
    requestAnimationFrame(()=>{
      const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
      let left = r.left + r.width/2 - tw/2;
      left = Math.min(Math.max(8, left), window.innerWidth - tw - 8);
      let top = r.top - th - 8;
      if(top < 8) top = r.bottom + 8;
      tipEl.style.left = left + 'px';
      tipEl.style.top = top + 'px';
    });
  }
  function hide(){ tipEl.style.display = 'none'; }
  document.addEventListener('mouseover', e=>{ const t = e.target.closest('.infodot'); if(t) place(t); });
  document.addEventListener('mouseout', e=>{ if(e.target.closest('.infodot')) hide(); });
  document.addEventListener('focusin', e=>{ const t = e.target.closest('.infodot'); if(t) place(t); });
  document.addEventListener('focusout', e=>{ if(e.target.closest('.infodot')) hide(); });
  document.addEventListener('scroll', hide, true);
}

renderAll();
initGlobalTooltip();
</script>
